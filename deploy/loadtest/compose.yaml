# 压测专用中间件。与 compose.yaml 的开发环境完全隔离：独立项目名、端口、卷和数据库，
# 避免压测数据、Kafka 积压和 MySQL 写入影响开发库。
#
# 资源限制是本机单节点实验值，不代表生产容量。四个服务与 Go 服务、压测客户端
# 共用一台机器，读数只能用于相对比较和拐点定位。
name: golitube-loadtest

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --tcp-backlog
      - "1024"
    cpus: 2
    mem_limit: 1g

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    cpus: 4
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /opt/kafka/bin/kafka-topics.sh
    # 压测只关心本次运行，保留 1 小时避免磁盘无限增长。
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - golitube-danmaku
      - --partitions
      - "3"
      - --replication-factor
      - "1"
      - --config
      - retention.ms=3600000

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: golitube-root-local
      MYSQL_DATABASE: golitube_loadtest
      MYSQL_USER: golitube
      MYSQL_PASSWORD: golitube-local
    command:
      - --innodb-buffer-pool-size=1G
      - --max-connections=200
    volumes:
      - mysql-data:/var/lib/mysql
    cpus: 4
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kafka-data:
  mysql-data:
